services:
  fabrogym:
    build:
      context: ./MVP_HTML
      dockerfile: Dockerfile
    container_name: fabrogym-mvp
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
